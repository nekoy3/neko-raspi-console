<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neko Console</title><link rel="stylesheet" href="/static/vendor/xterm.css"><link rel="stylesheet" href="/static/style.css"><body>

<main><header><div><small>SERIAL CONSOLE</small><h1>コンソールサーバー</h1><span id="hostName" class="host-name">—</span></div><button id="logout" hidden>ログアウト</button></header>
<section id="login"><h2>安全なコンソールアクセス</h2><p>操作するにはログインしてください。</p><form id="loginForm"><label>ユーザー名<input id="username" placeholder="ユーザー名" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">ログイン</button></form><p id="loginError" role="alert"></p></section>
<div id="dashboard" hidden><div class="workspace"><section class="ports"><div class="section-head"><h2 id="portCount">接続ポート（0）</h2><button id="refresh">↻</button></div><div id="portList"></div><div class="note">ケーブル固有IDで識別<br>通信設定：8N1 / フロー制御なし<br>コンソール内容はサーバーに保存しません</div></section>
<section class="terminal-panel"><div class="section-head"><div><h2 id="portName">コンソール</h2><small id="device">ポートを選択してください</small></div><span id="state" class="badge">未接続</span></div><div class="toolbar"><label>通信速度 <select id="baud"><option>9600</option><option>19200</option><option>38400</option><option>57600</option><option>115200</option></select> bps</label><button id="connect" class="primary">接続する</button><button id="disconnect" disabled>切断</button><button id="write" disabled>入力を有効化</button><button id="clear">画面クリア</button></div><div id="terminal"></div><footer><span id="message" role="status">受信のみで接続します。自動で改行やコマンドを送信しません。</span><span id="bytes">RX 0 B / TX 0 B</span></footer></section></div><div class="notice">⚑ 入力有効時は接続先機器へ直接送信されます。貼り付けは確認付き・最大2KBです。BREAK / 電源操作は提供しません。</div></div></main><script src="/static/vendor/xterm.js"></script><script src="/static/vendor/addon-fit.js"></script><script src="/static/app.js"></script></body></html>
